name: CI
on:
  pull_request:
  push:
    branches:
      - "main"
permissions:
  contents: read
defaults:
  run:
    working-directory: v2
jobs:
  test:
    name: Small test
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: v2/go.mod
      - uses: flatt-security/setup-takumi-guard-golang@02545d3425218766aac4dca114dcc3f6eaa0df4a # v1.3.0
        with:
          bot-id: "${{ vars.TAKUMI_GUARD_BOT_ID }}"
      - run: make setup
      - run: make check-generate
      - run: make code-check
      - run: make test
        timeout-minutes: 20
      - run: make test-dcnet
        timeout-minutes: 20
      - run: make test-vm
        timeout-minutes: 20
  e2e:
    name: End-to-end Test
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: flatt-security/setup-takumi-guard-golang@02545d3425218766aac4dca114dcc3f6eaa0df4a # v1.3.0
        with:
          bot-id: "${{ vars.TAKUMI_GUARD_BOT_ID }}"
          # The token is forwarded to the GCE instance and has to stay valid
          # until the e2e test has downloaded its modules there.
          expires-in: "3600"
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.NECO_TEST_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Set GCP instance name
        run: "echo INSTANCE_NAME=placemat-${{ github.run_number }}-$(TZ=Asia/Tokyo date +%H%M%S) >> $GITHUB_ENV"
      - name: Run e2e test on GCP instance
        run: ../bin/run-mtest.sh
      - name: Set the instance lifetime
        run: ../bin/set-lifetime.sh
        if: failure()
